
name: Build Custom PowerToys

on:
  push:
    branches:
      - feature/app-scope-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Check environment
        shell: pwsh
        run: |
          dotnet --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -property installationVersion

      - name: Build PowerToys x64 Release
        shell: pwsh
        run: |
          .\tools\build\build.ps1 -Platform x64 -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PowerToys-Custom-x64
          path: x64/Release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
