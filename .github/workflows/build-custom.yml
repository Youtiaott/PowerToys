name: Build Custom PowerToys Installer

on:
  push:
    branches:
      - feature/app-scope-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Check build environment
        shell: pwsh
        run: |
          dotnet --version
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          & $vswhere -latest -property installationVersion

      - name: Build x64 Release and WiX EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\\tools\\build\\build-installer.ps1 -Platform x64 -Configuration Release -PerUser true -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare installer and SHA256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerDir = 'installer/PowerToysSetupVNext/x64/Release/UserSetup'
          $installers = @(Get-ChildItem -LiteralPath $installerDir -Filter 'PowerToysUserSetup-*.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            Write-Host 'Installer output files:'
            Get-ChildItem 'installer/PowerToysSetupVNext/x64/Release' -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Expected one PowerToysUserSetup EXE in $installerDir, found $($installers.Count)"
          }
          $outDir = 'artifacts/distribution'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $source = $installers[0]
          $dest = Join-Path $outDir $source.Name
          Copy-Item -LiteralPath $source.FullName -Destination $dest -Force
          $checksum = Get-FileHash -LiteralPath $dest -Algorithm SHA256
          "$($checksum.Hash) *$($source.Name)" | Set-Content -Path (Join-Path $outDir 'SHA256SUMS.txt') -Encoding ascii
          $signature = Get-AuthenticodeSignature -LiteralPath $dest
          Write-Host "Installer: $($source.Name)"
          Write-Host "Size in bytes: $((Get-Item -LiteralPath $dest).Length)"
          Write-Host "SHA256: $($checksum.Hash)"
          Write-Host "Authenticode status: $($signature.Status)"
          Write-Host 'This is a custom, unofficial PowerToys build.'

      - name: Upload only the installer
        uses: actions/upload-artifact@v4
        with:
          name: PowerToys-Custom-Installer-x64
          path: artifacts/distribution/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Print MSBuild errors if packaging fails
        if: failure()
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem 'artifacts/logs' -Recurse -Filter '*.errors.log' -File -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) { Write-Host 'No MSBuild errors.log files found; see build step output.' }
          foreach ($log in $logs) {
            Write-Host "::group::$($log.FullName)"
            Get-Content -LiteralPath $log.FullName -Tail 150
            Write-Host '::endgroup::'
          }

      - name: Upload diagnostic errors only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PowerToys-Installer-Build-Errors
          path: artifacts/logs/**/*.errors.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
